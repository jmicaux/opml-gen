<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPML Generator — build an OPML file from RSS feeds</title>
  <meta name="description" content="Free online OPML generator. Paste a list of RSS feed URLs and instantly build an OPML 2.0 file to import into any feed reader. No signup, runs entirely in your browser.">
  <meta name="keywords" content="opml generator, opml builder, create opml, rss to opml, opml file, rss feeds, feed reader import">

  <!-- Theme -->
  <meta name="theme-color" content="#12336b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#2b6fe0" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="assets/opml-icon.png" sizes="32x32">

  <!-- Social sharing -->
  <meta property="og:url" content="https://jmicaux.github.io/opml-gen/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OPML Generator">
  <meta property="og:title" content="OPML Generator — build an OPML file from RSS feeds">
  <meta property="og:description" content="Paste a list of RSS feed URLs and instantly build an OPML 2.0 file to import into any feed reader. Free, no signup, runs in your browser.">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://jmicaux.github.io/opml-gen/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OPML Generator — build an OPML file from your RSS feeds">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OPML Generator — build an OPML file from RSS feeds">
  <meta name="twitter:description" content="Paste a list of RSS feed URLs and instantly build an OPML 2.0 file to import into any feed reader.">
  <meta name="twitter:image" content="https://jmicaux.github.io/opml-gen/og-image.png">

  <!-- Canonical -->
  <link rel="canonical" href="https://jmicaux.github.io/opml-gen/">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "OPML Generator",
    "description": "Build an OPML 2.0 file from a list of RSS feed URLs, in your browser.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <link rel="stylesheet" href="styles.css">
  <!-- Umami analytics (privacy-friendly, cookieless) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="c762aadf-9152-4e82-ab9a-cd19552819b6"></script>
</head>
<body>
  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <img class="logo" src="assets/opml-icon.png" alt="" width="48" height="48">
      <div>
        <h1 id="page-title">OPML generator</h1>
        <p>Paste a list of RSS feed URLs, one per line, then generate an OPML file you can import into a feed reader.</p>
      </div>
    </section>

    <form class="generator" id="generator-form">
      <label for="feeds">RSS feed URLs</label>
      <textarea id="feeds" name="feeds" rows="12" spellcheck="false">http://www.theverge.com/rss/index.xml
https://techcrunch.com/feed/
http://feeds.mashable.com/Mashable
http://www.engadget.com/rss.xml</textarea>

      <div class="controls">
        <label class="field">
          <span>OPML title</span>
          <input id="opml-title" name="title" type="text" value="My RSS feeds">
        </label>
        <button type="submit">Generate</button>
      </div>
    </form>

    <section class="result" aria-labelledby="result-title">
      <div class="result-header">
        <h2 id="result-title">Generated OPML</h2>
        <div class="actions">
          <button type="button" id="copy-button" disabled>Copy</button>
          <a class="button-link is-disabled" id="download-link" href="#" download="feeds.opml" aria-disabled="true">Download</a>
        </div>
      </div>
      <p class="status" id="status" role="status">No OPML generated yet.</p>
      <pre><code id="output"></code></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
